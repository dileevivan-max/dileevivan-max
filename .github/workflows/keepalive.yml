# Не даёт бесплатному проекту Supabase (revizia-msc) уснуть: раз в 3 дня обращается к базе.
# Ключ ниже — публичный ключ anon, он и так лежит в программе revizia/index.html.
name: Supabase keep-alive (revizia)
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping revizia-msc
        env:
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vcWNsamNrZXRobmdxZ3Joa3B0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1Nzk4OTgsImV4cCI6MjEwODE1NTg5OH0.L0qSRi2gr9g4X2rRK3sWt8ENA9p7DX0tTJNeJ42j1Vk
        run: |
          curl -sS -f -X POST "https://ooqcljckethngqgrhkpt.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" -d '{}'
